<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFINITE LOGIN</title>
    <link rel="stylesheet" href="ASSETS/STYLES/INFINITE LOGIN.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="Form login-form">
            <h2>Login</h2>
            <form action="#">
                <div class="input-box">
                    <i class='bx bxs-user'></i>
                    <label for="#">Email</label>
                    <input type="text" placeholder="Enter Your Email*">
                </div>
                <div class="input-box">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="text" placeholder="Enter Your Password*">
                    <label for="#">Password</label>
                </div>
                <div class="forgot-section">
                    <span><input type="checkbox" name="" id="checked">Remember Me</span>
                    <span><a href="#">Forgot Password ?</a></span>
                </div>
                <button class="btn">Login</button>
            </form>
            <p>Or Sign up using</p>
            <div class="social-media">
                <a href="https://id-id.facebook.com/login.php/"><i class='bx bxl-facebook'></i></a>
                <a href="https://g.co/kgs/wkAAqLb"><i class='bx bxl-google'></i></a>
                <a href="https://twitter.com/i/flow/login"><i class='bx bxl-twitter'></i></a>
            </div>
            <p class="RegisteBtn RegiBtn"><a href="#">Register Now</a></p>
        </div>
        <div class="Form Register-form">
            <h2>Register</h2>
            <form action="#">
                <div class="input-box">
                    <i class='bx bxs-user'></i>
                    <label for="#">Email</label>
                    <input type="text" placeholder="Enter Your Email*">
                </div>
                <div class="input-box">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="text" placeholder="Enter Your Password*">
                    <label for="#">Password</label>
                </div>
                <i class="ri-eye-off-line login__eye" id="login-eye"></i>
                <div class="input-box">
                    <i class='bx bxs-lock-alt'></i>
                    <input type="text" placeholder="Enter Your Password*">
                    <label for="#">Confirm Password</label>
                </div>
                <div class="forgot-section">
                    <span><input type="checkbox" name="" id="checked">Remember Me</span>
                    <span><a href="#">Forgot Password ?</a></span>
                </div>
                <button class="btn" class="loginBtn">Register</button>
            </form>
            <p class="LoginBtn"><a href="#">Login Now</a></p>
        </div>
        <button class="home-btn" onclick="location.href='INFINITE.html'">Home</button>
    </div>
    
    <script src="ASSETS/SCRIPTS/INFINITE LOGIN.js"></script>

</body>
</html>
